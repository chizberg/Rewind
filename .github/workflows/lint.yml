name: lint
on: [pull_request]
jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Install SwiftFormat
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 -o swiftformat.zip https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.6/swiftformat.zip
          unzip -q swiftformat.zip -d /usr/local/bin
          rm swiftformat.zip
      - name: Run SwiftLint
        run: swiftlint --strict
      - name: Run SwiftFormat
        run: swiftformat . --lint